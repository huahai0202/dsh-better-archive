<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none" role="img" aria-label="Better archive">
  <!-- Same tile recipe as the neighbouring plugins (dsh-rewind-plugin,
       dsh-web-fetch-hub, and the product's own Subagent artwork): a rounded
       square inset from the 36-unit canvas, carrying the product's vertical
       light-to-dark blue gradient (#69B9FF -> #324DE2). The tile is what makes
       this icon sit beside the installed ones at row size, so it stays.

       The mark is a storage drawer rather than a box with an arrow. The drawer
       reads as "kept, not gone" at 20 px where the old box-plus-arrow collapsed
       into a blob: one heavy horizontal lid, a shallow body, and a pull handle —
       all on a 16-unit grid, scaled 1.4x like the neighbouring icons, with a
       1.5-unit stroke whose ratio matches theirs. The handle is a solid bar so
       the shape keeps an anchor point when the tile is only 20 px wide. -->
  <g transform="translate(18 18) scale(0.9286) translate(-18 -18)">
    <rect x="4" y="4" width="28" height="28" rx="8" fill="url(#better_archive_blue)" />
    <g transform="translate(7.6 7.4) scale(1.4)" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Lid: the heaviest line, so the silhouette survives downscaling. -->
      <path d="M1.8 3.4h12.4" />
      <!-- Drawer body. -->
      <path d="M3.4 3.4v6.9a2.4 2.4 0 0 0 2.4 2.4h5.6a2.4 2.4 0 0 0 2.4-2.4V3.4" />
      <!-- Pull handle. -->
      <path d="M6.2 8.4h4.2" />
    </g>
  </g>
  <defs>
    <linearGradient id="better_archive_blue" x1="18" y1="4" x2="18" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69B9FF" />
      <stop offset="1" stop-color="#324DE2" />
    </linearGradient>
  </defs>
</svg>
